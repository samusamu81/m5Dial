    - obj: {id: vu_l_3, align: CENTER, x: -12, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_4, align: CENTER, x: -4, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_5, align: CENTER, x: 4, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_6, align: CENTER, x: 12, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_7, align: CENTER, x: 20, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_8, align: CENTER, x: 28, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_9, align: CENTER, x: 36, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_r_0, align: CENTER, x: -36, y: 88, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_r_1, align: CENTER, x: -28, y: 88, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_r_2, align: CENTER, x: -20, y: 88, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_r_3, align: CENTER, x: -12, y: 88, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
