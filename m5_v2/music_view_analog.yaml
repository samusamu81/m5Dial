obj: # music_view_analog: quadrante volume 270 gradi (gap in basso), scala 0-25 + ago "a punto" che segue il volume
  id: music_view_analog
  hidden: true
  height: 240 # esplicito, non SIZE_CONTENT (vedi esphome-lvgl-quirks: centratura)
  width: 240
  align: CENTER
  pad_all: 0
  border_width: 0
  bg_color: 0x000000
  bg_opa: COVER
  widgets:
    - meter:
        width: 240
        height: 240
        align: CENTER
        bg_opa: TRANSP
        border_width: 0 # sopprime il bordo LIGHT_STYLE del meter (vedi esphome-lvgl-quirks)
        text_color: 0x808080 # etichette 0,5,...,25 in grigio (text_color ereditato dalle scale figlie)
        scales:
          - range_from: 0 # scala graduata 0-25: principali ogni 5 (con etichetta), secondarie ogni 1, sul bordo esterno
            range_to: 25
            angle_range: 270
            rotation: 135 # 0 in basso a sinistra, 25 in basso a destra, gap 90 in basso
            ticks:
              count: 26 # 0,1,...,25
              width: 2
              length: 5 # accorciate (erano 7/14, gap 8) per spingere le etichette verso il bordo: liberano spazio al cerchio centrale
              color: 0xFFFFFF
              major:
                stride: 5 # 0,5,10,15,20,25
                width: 3
                length: 10
                color: 0xFFFFFF
                label_gap: 2 # etichette a r~82-98
          - range_from: 0 # ago del volume: scala 0-100 (= volume_level x 100), stessi angoli della scala graduata
            range_to: 100
            angle_range: 270
            rotation: 135
            indicators:
              - line:
                  id: music_volume_needle
                  width: 7 # dimezzato (era 14), arrotondato: oltre il cerchio centrale ne resta visibile solo la punta
                  color: 0xFF0000 # rosso
                  rounded: true
                  length: 80 # valore assoluto: punta a r=80, cerchio centrale r=72.5 -> sporge ~7px (+ tappo tondo), sotto le etichette (r~82)
                  value: 0
    # VU meter stereo decorativo nel gap in basso (sotto il cerchio, tra lo 0 e il 25): 2 righe da 10 led 6x5 (L sopra, R sotto),
    # 7 verdi + 2 gialli + 1 rosso, spenti = grigio scuro. NON e' il segnale audio reale (il player non lo espone in HA):
    # animazione pseudo-casuale attiva solo in play, vedi interval/music_vu_tick in music_act.yaml.
    - obj: {id: vu_l_0, align: CENTER, x: -36, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
    - obj: {id: vu_l_1, align: CENTER, x: -28, y: 79, width: 6, height: 5, radius: 1, pad_all: 0, border_width: 0, bg_color: 0x202020, bg_opa: COVER, clickable: false, scrollable: false}
