obj: # light_hwb_view_moderno: 3 archi concentrici (H/Wh/Bl, esterno->interno), gap 90 in basso, modellata su light_rgbw_view_moderno.
  id: light_hwb_view_moderno # Selezione canale: riga "H Wh Bl" (lettere su sfondo grigio) nel gap in basso, tap = ciclo H->Wh->Bl->nessuno. Pallino centrale identico a RGBW.
  hidden: true
  height: 240
  width: 240
  align: CENTER
  pad_all: 0
  border_width: 0
  bg_color: 0x000000
  bg_opa: COVER
  widgets:
    - arc: # H, esterno (230px): traccia piena del colore della hue (grigia se luce off), knob alla posizione della hue
        id: arc_hwb_h
        align: CENTER
        width: 230
        height: 230
        start_angle: 135
        end_angle: 45 # 270 gradi, gap 90 in basso (come light_rgbw_view_moderno)
        min_value: 0
        max_value: 359
        value: 0
        adjustable: false # pilotato solo dall'encoder
        arc_width: 10
        arc_opa: COVER
        arc_color: 0x808080
        arc_rounded: false
        indicator:
          arc_opa: TRANSP # l'anello e' sempre "pieno": lo disegna la traccia (arc_color = hue pura, da hwb_refresh_view);
                          # il valore (hue) serve solo a posizionare il knob quando H e' selezionato
        knob: # visibile solo se canale selezionato (vedi hwb_update_selection)
          bg_opa: TRANSP
          bg_color: 0xFFFFFF
          border_width: 0
          border_color: 0x000000
          pad_all: 4
    - arc: # Wh (180px): fondo grigio scuro, si riempie di bianco
        id: arc_hwb_w
        align: CENTER
        width: 180
        height: 180
        start_angle: 135
        end_angle: 45 # 270 gradi, gap 90 in basso (come light_rgbw_view_moderno)
        min_value: 0
        max_value: 100
        value: 0
        adjustable: false # pilotato solo dall'encoder
        arc_width: 10
        arc_opa: COVER
        arc_color: 0x202020
        arc_rounded: false
        indicator:
          arc_width: 10
          arc_color: 0xFFFFFF # si riempie di bianco (Wh 0-100)
          arc_rounded: true
        knob: # visibile solo se canale selezionato (vedi hwb_update_selection)
          bg_opa: TRANSP
          bg_color: 0xFFFFFF
          border_width: 0
          border_color: 0x000000
          pad_all: 4
    - arc: # Bl (130px): fondo grigio scuro, si riempie di nero
        id: arc_hwb_b
        align: CENTER
        width: 130
        height: 130
        start_angle: 135
        end_angle: 45 # 270 gradi, gap 90 in basso (come light_rgbw_view_moderno)
        min_value: 0
        max_value: 100
        value: 0
        adjustable: false # pilotato solo dall'encoder
        arc_width: 10
        arc_opa: COVER
        arc_color: 0x202020
        arc_rounded: false
        indicator:
          arc_width: 10
          arc_color: 0x000000 # si riempie di nero (Bl 0-100)
          arc_rounded: true
        knob: # visibile solo se canale selezionato (vedi hwb_update_selection)
          bg_opa: TRANSP
          bg_color: 0xFFFFFF
          border_width: 0
          border_color: 0x000000
          pad_all: 4
    - led: # pallino centrale, identico a rgbw_center_dot: colore = rgb_color di HA (rgb_ha_*) + luminosita' bright_can, grigio se off
        id: hwb_center_dot
        align: CENTER
        width: 40
        height: 40
        color: 0x000000
        brightness: 0%
    # Riga "H Wh Bl" nel gap in basso: sfondo grigio, lettera del colore del proprio arco (H = hue pura, Wh = bianco,
    # Bl = nero). Selezionata = colori scambiati (sfondo del colore dell'arco, lettera grigia). Vedi hwb_update_selection.
    - label: {id: lbl_hwb_moderno_sel_h, align: CENTER, x: -47, y: 85, pad_left: 4, pad_right: 4, radius: 4, bg_color: 0x808080, bg_opa: COVER, text_color: 0x808080, text_font: font_rgbw_letter, text: "H"}
    - label: {id: lbl_hwb_moderno_sel_w, align: CENTER, x: -2, y: 85, pad_left: 4, pad_right: 4, radius: 4, bg_color: 0x808080, bg_opa: COVER, text_color: 0xFFFFFF, text_font: font_rgbw_letter, text: "Wh"}
    - label: {id: lbl_hwb_moderno_sel_b, align: CENTER, x: 45, y: 85, pad_left: 4, pad_right: 4, radius: 4, bg_color: 0x808080, bg_opa: COVER, text_color: 0x000000, text_font: font_rgbw_letter, text: "Bl"}
    - obj: # catcher generoso per il ciclo H->Wh->Bl->nessuno, sovrapposto alla riga di lettere
        align: CENTER
        x: 0
        y: 85
        width: 150
        height: 50
        pad_all: 0
        border_width: 0
        bg_opa: TRANSP
        on_click:
          - lambda: 'id(hwb_selected_channel) = (id(hwb_selected_channel) >= 2) ? -1 : id(hwb_selected_channel) + 1;'
          - script.execute: hwb_update_selection
