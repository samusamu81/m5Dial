# Fragment condiviso: swipe orizzontale "indietro". Stessa logica di
# common_swipe_next.yaml, nella direzione opposta.
- if:
    condition:
      lambda: |-
        return id(view_flag_analog) || id(view_flag_seg14) || id(view_flag_moderno) || id(view_flag_face);
    then:
      - lvgl.page.previous:
    else:
      - lvgl.page.show: page_settings
